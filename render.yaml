# Blueprint de deploy no Render — RASCUNHO, ainda não aplicado.
#
# Nenhuma conta ou serviço Render foi criado ainda; ver docs/02-ROADMAP.md
# (Fase 2) e .ai/context.md. Este arquivo documenta a configuração planejada
# para quando o usuário criar a conta/serviço no Render e conectar este
# repositório.
#
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: estrelar
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # O app é uma SPA (React Router com URLs próprias por área — ver
    # docs/07-CHANGELOG.md, "Roteamento real por URL"). Sem essa regra, um
    # link direto ou recarregar a página em /aprender, /missoes ou
    # /ferramentas devolveria 404 no servidor estático.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Valores nunca ficam neste arquivo nem no repositório (docs/04-REGRAS.md,
    # seção "Segurança"). `sync: false` faz o Render pedir o valor real na
    # criação do Blueprint ou no painel do serviço.
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
