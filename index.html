<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6ef" />
    <meta
      name="description"
      content="Aprenda a cuidar melhor da presença do seu negócio no Google com lições rápidas, missões práticas e acompanhamento do seu progresso."
    />
    <!--
      SEO básico da Landing Page pública (Etapa 3). O app é uma SPA com um
      único `index.html` para todas as rotas (`firebase.json` reescreve tudo
      para cá) e não usa nenhuma biblioteca de metadata por rota — por isso
      title/description/canonical/Open Graph ficam aqui, estáticos, cobrindo
      a rota pública `/` (a mais relevante para SEO). Nenhuma rota interna
      autenticada é indexável de qualquer forma (exige login).

      Canonical/og:url usam o domínio real do Firebase Hosting deste projeto
      (`estrelar-cc725`, ver `.firebaserc`) — `estrelar.app` continua só
      planejado, sem registro confirmado (`docs/01-PROJETO.md`), então não é
      usado aqui ainda.
    -->
    <link rel="canonical" href="https://estrelar-cc725.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://estrelar-cc725.web.app/" />
    <meta property="og:title" content="Estrelar — Aprenda a cuidar do Perfil da Empresa no Google" />
    <meta
      property="og:description"
      content="Aprenda a cuidar melhor da presença do seu negócio no Google com lições rápidas, missões práticas e acompanhamento do seu progresso."
    />
    <!--
      og:image (fechado depois da Etapa 3): imagem institucional gerada sob
      aprovação humana a partir do prompt de `docs/06-DESIGN-SYSTEM.md`
      (mascote "Estrelo" + wordmark + tagline do Hero), 1200×630 (proporção
      recomendada pelo Open Graph), revisada e redimensionada antes de
      publicar em `public/og-image.jpg`.
    -->
    <meta property="og:image" content="https://estrelar-cc725.web.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Estrelar — Aprenda a cuidar do Perfil da Empresa no Google" />
    <meta
      name="twitter:description"
      content="Aprenda a cuidar melhor da presença do seu negócio no Google com lições rápidas, missões práticas e acompanhamento do seu progresso."
    />
    <meta name="twitter:image" content="https://estrelar-cc725.web.app/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Estrelar — Aprenda a cuidar do Perfil da Empresa no Google</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
